<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean white background -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <!-- Subtle border for crisp visibility on light / white browser bars -->
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- ArD in deep solid black, modern grotesque typography -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="-1"
    fill="#000000">ArD</text>
</svg>
