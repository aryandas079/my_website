<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="adGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded modern dark background -->
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <!-- Subtle border highlight -->
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Monogram AD -->
  <g filter="url(#subtleGlow)">
    <text
      x="32"
      y="42"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="-1.5"
      fill="url(#adGrad)">AD</text>
  </g>
</svg>
